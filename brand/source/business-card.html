<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voiced Business Card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@700;800&family=Funnel+Sans:wght@400;600;700&display=swap">
<style>
/* US business card: 3.5 x 2 in trim, 0.125 in bleed on every side.
   Keep text at least 0.125 in inside the trim (the "safe" line). */
@page { size: 3.75in 2.25in; margin: 0; }
:root {
  --navy: #213244; --mist: #F3F9FE; --sky: #8FCBF2; --butter: #FFDE9E; --body: #3C5266; --link: #1B5C8F;
  --bleed: 0.125in; --safe: 0.38in; /* bleed + 0.255in: clears printers whose safe line sits 0.125in inside the trim */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.card { width: 3.75in; height: 2.25in; position: relative; overflow: hidden; break-after: page; page-break-after: always; }
.card:last-child { break-after: auto; page-break-after: auto; }

/* Front */
.front { background: var(--navy); color: var(--mist); }
.front .rings { position: absolute; right: -0.45in; top: -0.42in; width: 2.3in; height: 2.3in; }
.front .logo { position: absolute; left: var(--safe); top: var(--safe); display: flex; align-items: center; gap: 0.09in; font: 800 17pt/1 "Funnel Display", sans-serif; letter-spacing: -0.02em; }
.front .line { position: absolute; left: var(--safe); bottom: calc(var(--safe) + 0.05in); font: 800 13.5pt/1.1 "Funnel Display", sans-serif; letter-spacing: -0.015em; }
.front .line .turn { color: var(--butter); position: relative; display: inline-block; }
.front .line svg { position: absolute; left: -3%; width: 106%; bottom: -0.3em; height: 0.36em; overflow: visible; }
.front .line path { fill: none; stroke: var(--sky); stroke-width: 1.6; stroke-linecap: round; }

/* Back */
.back { background: var(--mist); color: var(--navy); }
.back .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--bleed) + 0.09in); background: var(--butter); }
.back .info { position: absolute; left: var(--safe); top: var(--safe); bottom: calc(var(--safe) + 0.04in); display: flex; flex-direction: column; justify-content: space-between; }
.back .name { font: 800 14pt/1.05 "Funnel Display", sans-serif; letter-spacing: -0.015em; }
.back .role { font: 700 6.4pt/1 "Funnel Sans", sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: var(--link); margin-top: 0.07in; }
.back .desc { font: 400 7.4pt/1.35 "Funnel Sans", sans-serif; color: var(--body); margin-top: 0.07in; max-width: 1.75in; }
.back .contact { display: grid; gap: 0.045in; font: 400 7.6pt/1.2 "Funnel Sans", sans-serif; color: var(--body); }
.back .contact b { font-weight: 700; color: var(--navy); display: inline-block; width: 0.62in; }
.back .mark { display: flex; align-items: center; gap: 0.05in; font: 800 8.5pt/1 "Funnel Display", sans-serif; }
/* QR space: plain white square with room around it so any QR code scans. */
.back .qr { position: absolute; right: var(--safe); top: var(--safe); width: 1.05in; height: 1.05in; background: #FFFFFF; border-radius: 0.08in; }
.back .qr img { display: block; width: 100%; height: 100%; padding: 0.03in; image-rendering: pixelated; }
.back .qr-cap { position: absolute; right: var(--safe); width: 1.05in; top: calc(var(--safe) + 1.12in); text-align: center; font: 600 6.4pt/1 "Funnel Sans", sans-serif; color: var(--body); }
</style>
</head>
<body>

<section class="card front">
  <svg class="rings" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="49" fill="none" stroke="#8FCBF2" stroke-width="0.6" opacity="0.35"/><circle cx="50" cy="50" r="36" fill="none" stroke="#8FCBF2" stroke-width="0.5" opacity="0.25"/><circle cx="50" cy="50" r="23" fill="none" stroke="#8FCBF2" stroke-width="0.4" opacity="0.18"/></svg>
  <div class="logo">
    <svg width="30" height="30" viewBox="0 0 64 64"><circle cx="32" cy="32" r="31" fill="#213244"/><circle cx="32" cy="32" r="31" fill="none" stroke="#8FCBF2" stroke-width="2.5" opacity="0.9"/><circle cx="32" cy="32" r="24" fill="none" stroke="#8FCBF2" stroke-width="1" opacity="0.4"/><path d="M20 22 L32 44 L44 22" fill="none" stroke="#FFDE9E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Voiced
  </div>
  <p class="line">Nothing for me,<br><span class="turn">without me.<svg viewBox="0 0 200 24" preserveAspectRatio="none"><path d="M4 15 C 40 9, 85 7, 130 9 S 185 13, 196 8 M 18 20 C 60 15, 120 14, 170 17"/></svg></span></p>
</section>

<section class="card back">
  <div class="info">
    <div>
      <p class="name">Samhitha<br>Gandavarapu</p>
      <p class="role">Founder, Voiced</p>
      <p class="desc">Helping people with Down syndrome be heard in healthcare.</p>
    </div>
    <div class="contact">
      <p><b>Website</b>withvoiced.org</p>
      <p><b>Email</b>withvoiced@gmail.com</p>
    </div>
  </div>
  <div class="qr"><img src="qr-code.png" alt="QR code"></div>
  <p class="qr-cap">Scan to learn more</p>
  <div class="stripe"></div>
</section>

</body>
</html>
